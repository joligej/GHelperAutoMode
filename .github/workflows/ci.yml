name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build application
        shell: powershell
        run: .\scripts\build.ps1 -Clean -SelfContained -Strict

      - name: Verify formatting
        shell: powershell
        run: dotnet format GHelperAutoMode.csproj --verify-no-changes --no-restore

      - name: Build installers
        shell: powershell
        run: .\scripts\build-installer.ps1 -SkipAppBuild -Strict
